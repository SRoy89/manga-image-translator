storage:
  raw: "./data/raw"
  translated: "./data/translated"

download:
  timeout: 20
  retries: 3
  delay: 1.0
  concurrency: 3

sources:
  mangadex:
    translated_languages:
      - en
      - ja
      - ko
      - zh
      - zh-hk
    data_saver: false

translation:
  translator: "deepseek"
  target_language: "VIN"

  font_path: "./fonts/Arial-Unicode-Regular.ttf"
  renderer: "default"
  alignment: "center"
  direction: "horizontal"

  uppercase: false
  font_size_offset: 2
  font_size_minimum: 18
  no_hyphenation: true
  line_spacing: -0.05
  disable_font_border: false

database:
  path: "./data/state.db"
